[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --self-contained-html --html=reports/pytest-debug.html
markers =
    login: login page and authentication
    login_visual: sign-in form pixel baseline
    cart: shopping cart
    smoke: critical-path checks
    tabs: navigation tabs and hamburger menu
    automotive: Amazon Automotive / Your Garage
    search: search results pagination, an empty search, and the 4 Stars & Up filter
    language: header language preferences
    bestsellers: Best Sellers department list and ranked products
    help: Amazon Customer Service help library and topics
    deals: Today's Deals filters and priced deal cards
    registry: Amazon Registry tiles and Baby Registry name search
    new_releases: New Releases department list and ranked products
    gift_cards: Gift Cards shop sections and a priced Birthday eGift
    find_a_gift: Find a Gift shop sections and a priced birthday gift
    sell: Sell on Amazon account steps and priced selling plans
    amazon_home: Amazon Home store categories and a priced Kitchen & Dining product
    books: Books store sections and a priced Literature & Fiction book
    beauty: Beauty store categories and a priced Makeup product
    electronics: Electronics store categories and a priced Headphones product
    baby: Baby store categories and a priced Strollers product
    footer: desktop footer columns, help links, and Back to top
    sports: Sports & Outdoors store categories and a priced Cycling product
    video_games: Video Games store categories and a priced Digital Games product
    pet_supplies: Pet Supplies store categories and a priced Dogs product
    product: product detail title, price, and Add to cart after a search
    tools: Tools & Home Improvement store categories and a priced Power & Hand Tools product
    ci_skip: cannot pass on GitHub-hosted runners (headless garage flow or an Amazon bot wall)
    chromium_only: sign-in pixel baseline was captured on Chromium; skipped on Firefox and WebKit
    desktop_only: desktop layout, hamburger menu, page strip, or visual baseline; skipped with --device mobile
