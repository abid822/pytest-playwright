[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --self-contained-html --html=reports/pytest-debug.html
markers =
    login: login page and authentication
    cart: shopping cart
    smoke: critical-path checks
    tabs: navigation tabs and hamburger menu
    automotive: Amazon Automotive / Your Garage
    search: search results pagination
    language: header language preferences
    ci_skip: cannot pass on GitHub-hosted runners (headless garage flow or an Amazon bot wall)
    chromium_only: sign-in pixel baseline was captured on Chromium; skipped on Firefox and WebKit
    desktop_only: desktop layout, hamburger menu, page strip, or visual baseline; skipped with --device mobile
